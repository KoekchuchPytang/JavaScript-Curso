<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 Exercise</title>
  <link rel="stylesheet" href="/styles/10-exercise.css">
</head>
<body>
  <button class="addButton">
    Add to Cart
  </button>

  <button class="requestButton">
    Request now
  </button>

  <button class="scheduleButton">
    Schedule for later
  </button>

  <button class="desgraca js-button" onclick="
    hasClass('desgraca');
  ">
    Test
  </button>

  <button class="gamingButton" onclick="
    ligarDesligar('gamingButton');
  ">
    Gaming
  </button>

  <button class="musicButton" onclick="
    ligarDesligar('musicButton');
  ">
    Music
  </button>

  <button class="techButton" onclick="
    ligarDesligar('techButton');
  ">
    Tech
  </button>
  
  <p></p>
  
  <p>Amazon Shipping Calculator</p>
    <input placeholder="Cost of order" class="js-cost-input cost-input" onkeydown="
      handleCostKeydown(event);
    ">
    <button onclick="
      calculateTotal();
    " class="calculate-button">Calculate</button>
    <p class="js-total-cost"></p>

    <p class="error-message"></p>
    
  <script src="/scripts/10-exercise.js"></script>
</body>
</html>
