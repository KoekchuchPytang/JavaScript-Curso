<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="/styles/10-rock-paper-scissors.css">
</head>
<body>
    <p class="title">Rock Paper Scissors</p>

    <button onclick="
      playGame('rock');
    " class="move-button">
    <img src="/midia/rock-emoji.png" alt="Mão fechada, pedra. " class="move-icon">
    </button>

    <button onclick="
      playGame('paper');
    " class="move-button">
    <img src="/midia/paper-emoji.png" alt="Mão aberta, papel." class="move-icon">
    </button>

    <button onclick="
      playGame('scissors');
    " class="move-button">
    <img src="/midia/scissors-emoji.png" alt="Dois dedos esticados, tesoura." class="move-icon">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves">
      You <img src="/midia/rock-emoji.png" alt="emoji pedra" class="move-icon">
      <img src="/midia/scissors-emoji.png" alt="emoji tesoura" class="move-icon"> 
      Computer
    </p>
    <p class="js-score score"></p>

    <button onclick=
    "
    score.wins = 0;
    score.ties = 0;
    score.losses = 0;

    localStorage.removeItem('score');
    updateScoreElement();
    "
    class="reset-score-button"
    >Reset Score</button>

    

    <p class="final-project-link">
      <a href="https://supersimple.dev/projects/rock-paper-scissors">Click here</a>
      to see the final version of the project.
    </p>

    <script src="/scripts/10-rock-paper-scissors.js"></script>
</body>
</html>
