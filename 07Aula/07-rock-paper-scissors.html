<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <p>Rock Paper Scissors</p>
    <button onclick=
    "   
        playGame('Rock');
    "
    >Rock</button>

    <button onclick=
    "  
        playGame('Paper');
    "
    >Paper</button>

    <button onclick=
    "  
        playGame('Scissors');
    ">Scissors</button>

    <p><a href="">Click here </a>to see the final version of the project</p>

    <script>
        
        let result = '';
        let computerMove = '';

        function playGame(playerChoice){

            pickComputerMove();

            if ((computerMove === 'Rock' && playerChoice === 'Scissors')||(computerMove === 'Paper' && playerChoice === 'Rock')||(computerMove === 'Scissors' && playerChoice === 'Paper')){
            result = 'You lose';
            }
            else if ((computerMove === 'Rock' && playerChoice === 'Paper')||(computerMove === 'Paper' && playerChoice === 'Scissors')||(computerMove === 'Scissors' && playerChoice === 'Rock')){
                result = 'You win';
            }
            else if ((computerMove === 'Rock' && playerChoice === 'Rock')||(computerMove === 'Paper' && playerChoice === 'Paper')||(computerMove === 'Scissors' && playerChoice === 'Scissors')){
                result = 'Tie';
            }
            alert(`You picked ${playerChoice}, Computer picked ${computerMove}. ${result}.`)
        }

        function pickComputerMove(){
            const randomNumber = Math.random()
            if (randomNumber >= 0 && randomNumber < 1/3){
                computerMove = 'Rock';
            }
            else if (randomNumber >= 1/3 && randomNumber < 2/3){
                computerMove = 'Paper';
            }
            else{
                computerMove = 'Scissors';
            }
            return computerMove;
        }
    </script>
</body>
</html>
