<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Projects</title>
</head>
<body>
  <p>Youtube Subscribe Button</p>
  <button onclick="
    subscribe();
  " class="js-subscribe-button">Subscribe</button>

  <p>Amazon Shipping Calculator</p>

  <input placeholder="Cost of order" class="js-cost-input" onkeydown="
    handCostKeydown(event);
  ">

  <button onclick="
    calculateTotal();
  ">Calculate</button>
  
  <p class="js-total-cost"></p>

  <input placeholder="type something" class="js-something-input" onkeyup="
    writting(event);
  ">

  <p class="js-something-show"></p>
  

  <script>
    textBlock = '';

    function writting(event){
      //textBlock += event.key;
      console.log(event.key);
      textBlock = document.querySelector('.js-something-input').value;
      document.querySelector('.js-something-show').innerHTML = textBlock;
    }
    function handCostKeydown(event){
      if (event.key === 'Enter') {
      calculateTotal();
    }
    }
    function calculateTotal(){
      const inputElement = document.querySelector('.js-cost-input');
      let cost = 100*(Number(inputElement.value));
      
      if (cost < 4000) {
        cost += 1000;
      };

      document.querySelector('.js-total-cost')
        .innerHTML = `$${cost/100}`;
    }

    function subscribe() {
      const buttonElement = document.querySelector('.js-subscribe-button');
    if (buttonElement.innerText === 'Subscribe') {
      buttonElement.innerHTML = 'Subscribed';
    } else {
      buttonElement.innerHTML = 'Subscribe';
    };
    }
  </script>
</body>
</html>
