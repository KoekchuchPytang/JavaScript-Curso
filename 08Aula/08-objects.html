<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    
    <script>
        const product = {
            name: 'socks',
            price: 1090,
            produto: {
                canalhas: 1000,
                petistas: true
            }
        }
        console.log(product);
        console.log(product.name);
        console.log(product.price);

        product.name = 'desgraça';

        console.log(product);

        product.newPropety = true;
        console.log(product);

        delete product.newPropety;
        console.log(product);

        console.log(product.produto.canalhas);

        const product2 = {
            name: 'shirt',
            'delivery-time': '1 day',
            rating: {
                stars: 4.5,
                count: 87
            },
            canalhas: 'petista',
            fun: function function1(){
                console.log('function inside object');
            }
        };
        console.log(product2);
        console.log(product2.name);
        console.log(product2['name']);
        console.log(product2['delivery-time']);

        console.log(product2.rating.count);
        product2.fun();

        console.log(typeof console);
        console.log(typeof console.log);
        
        console.log(product2)
        console.log(JSON.stringify(product2));
        
        const jsonString = JSON.stringify(product2);

        console.log(JSON.parse(jsonString));

        console.log(`hello`.length);
        console.log(`hello`.toUpperCase());

        const object1 = {
            message: 'hello'
        };
        
        object1.message = 'Good job';

        const object2 = object1;
        console.log(object1);
        console.log(object2);

        const object3 = {
            message: 'Good job'
        };
        console.log(object3 === object1);
        console.log(object2 === object1);

        const object4 = {
            message: 'Good job',
            price: 500,
            tamanho: 180
        };
        // const message = object4.message;
        // mesma coisa que
        const {message} = object4;
        const {price, tamanho} = object4;

        const object5 = {
            // pega o que está na variavel message
            //message: message
            message,
            // faz a mesma coisa só q shortcut
            //method: function function1(){
            //    console.log('method')
            //}
            /**
             * 
             */
            method() {
                console.log('method');
            }
            // mesma coisa só que em shortcut
        }
        console.log(object5);
        object5.method();


    </script>
</body>
</html>
