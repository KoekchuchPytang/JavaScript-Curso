    <title>Booleans</title>
</head>
<body>
    
    <script>
        true
        false
        
        console.log(3 > 5);

        console.log(3 > 5 - 5);

        console.log(5 == '5');

        console.log(5 === '5');

        const age = 15;

        if(false) {
            console.log('Hello');
        }else{
            console.log('else');
        }

        if( age >= 16){
            console.log('You can drive');
        }
        else if(age >= 14){
            console.log('Almost.')
        }
        else{
            console.log('You can not drive');
        }

        console.log(true && true);

        console.log(true && false);

        console.log(0.2 >= 0 && 2.0 < 1/3);

        console.log(true || false);

        console.log(!true);
        // Assim dá pra colocar um if else numa variavel
        const result = true ? 'trusty' : 'Falsy';
        console.log(result)

        const message = 5 && 'hello';
        console.log(message);

        const currency = undefined || 'USD';
        console.log(currency);
